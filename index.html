<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Adamia — Maison de design web</title>
    <meta name="description" content="Adamia — Maison de design web. Discutons de votre projet.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --text: #fafafa;
            --text-secondary: #a1a1a1;
            --text-dim: #505050;
            --whatsapp: #25D366;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* ============================================
           AMBIENT BACKGROUND
           ============================================ */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(37, 211, 102, 0.07) 0%, rgba(37, 211, 102, 0.02) 40%, transparent 65%);
            border-radius: 50%;
            animation: breathe 7s ease-in-out infinite;
        }

        .bg-glow::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            top: 25%;
            left: 55%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            border-radius: 50%;
            animation: breathe 9s ease-in-out 2s infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Grain */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================
           SVG FILTERS FOR LIQUID GLASS
           ============================================ */
        .svg-filters {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* ============================================
           LAYOUT
           ============================================ */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            text-align: center;
            max-width: 480px;
        }

        /* Logo */
        .logo {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 2.8rem;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            box-shadow: 
                0 0 0 0.5px rgba(255, 255, 255, 0.06),
                0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Heading */
        .heading {
            font-size: clamp(2.4rem, 8vw, 3.6rem);
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.1;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
        }

        .heading span {
            background: linear-gradient(160deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Subtitle */
        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 3.5rem;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        /* ============================================
           TRUE LIQUID GLASS BUTTON
           ============================================ */
        .glass-wrapper {
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
        }

        .liquid-glass {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.15rem 2.8rem;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            border: none;
            cursor: pointer;
            border-radius: 980px;
            isolation: isolate;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);

            /* The glass itself */
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0.08) 100%
            );
            backdrop-filter: blur(40px) saturate(180%) brightness(1.1);
            -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.1);

            /* Multi-layer glass border system */
            box-shadow:
                /* Outer glow */
                0 0 0 0.5px rgba(255, 255, 255, 0.18),
                /* Top specular edge (light hitting the top of the glass) */
                inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
                /* Bottom inner shadow (glass thickness) */
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.06),
                /* Left specular edge */
                inset 1px 0 0 0 rgba(255, 255, 255, 0.1),
                /* Right specular edge */
                inset -1px 0 0 0 rgba(255, 255, 255, 0.1),
                /* Inner depth glow */
                inset 0 0 20px rgba(255, 255, 255, 0.03),
                /* Drop shadow */
                0 4px 12px rgba(0, 0, 0, 0.3),
                0 12px 40px rgba(0, 0, 0, 0.15);
        }

        /* Top specular arc — the key "liquid" refraction highlight */
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 15%;
            right: 15%;
            height: 45%;
            border-radius: 980px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.28) 0%,
                rgba(255, 255, 255, 0.08) 40%,
                rgba(255, 255, 255, 0.01) 70%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.5s ease;
        }

        /* Bottom caustic light — refracted light pooling at the bottom */
        .liquid-glass::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 20%;
            right: 20%;
            height: 30%;
            border-radius: 980px;
            background: linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.06) 0%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.5s ease;
        }

        /* Hover state */
        .liquid-glass:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.16) 0%,
                rgba(255, 255, 255, 0.07) 50%,
                rgba(255, 255, 255, 0.12) 100%
            );
            box-shadow:
                0 0 0 0.5px rgba(255, 255, 255, 0.25),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.08),
                inset 1px 0 0 0 rgba(255, 255, 255, 0.15),
                inset -1px 0 0 0 rgba(255, 255, 255, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.05),
                0 4px 16px rgba(0, 0, 0, 0.35),
                0 16px 50px rgba(0, 0, 0, 0.2),
                0 0 60px rgba(37, 211, 102, 0.06);
        }

        .liquid-glass:hover::before {
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.35) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                transparent 100%
            );
        }

        .liquid-glass:active {
            transform: translateY(0) scale(0.98);
            transition-duration: 0.15s;
            box-shadow:
                0 0 0 0.5px rgba(255, 255, 255, 0.15),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.04),
                inset 0 0 15px rgba(255, 255, 255, 0.02),
                0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Icon & text z-index */
        .glass-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            position: relative;
            z-index: 3;
            color: var(--whatsapp);
            filter: drop-shadow(0 0 8px rgba(37, 211, 102, 0.5));
        }

        .glass-label {
            position: relative;
            z-index: 3;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.8rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
        }

        .footer a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .footer a:hover { color: var(--text-secondary); }

        .footer span {
            color: #1a1a1a;
            font-size: 0.7rem;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
